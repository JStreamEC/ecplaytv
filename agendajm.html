<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda Deportiva</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: black;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 10px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
    }
    #buscador {
      max-width: 800px;
      margin: 0px auto 0;
      padding: 0 20px;
      text-align: center;
    }
    #buscador input {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 1em;
      border-radius: 5px;
      border: none;
      outline: none;
    }
    .agenda {
      margin: 20px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }
    /* Ajuste cuando hay un solo evento */
    .agenda.unico-evento .evento {
      max-width: 400px;
      margin: 0 auto;
    }
    .evento {
      background: #1b1b1b;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
      transition: transform 0.2s;

      /* Centrar contenido */
      align-items: center;
      text-align: center;
    }
    .evento:hover {
      transform: scale(1.03);
    }
    .evento img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
      object-fit: cover;
      max-height: 160px;
    }
    .evento h3 {
      margin: 0 0 10px 0;
      font-size: 1.1em;
      line-height: 1.3em;
      text-align: center;
    }
    .btn-ver {
      background: #ff4c4c;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      align-self: center;
    }
    .btn-ver:hover {
      background: #ff0000;
    }
    .mensaje {
      text-align: center;
      color: #bbb;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>Agenda Deportiva</header>

<div id="buscador">
  <input type="text" id="inputBuscar" placeholder="Buscar eventos..." />
</div>

<div class="agenda" id="agenda"></div>
<div class="mensaje" id="mensaje"></div>

<script>
  let eventosGlobal = [];

  function limpiarTitulo(titulo) {
    return titulo.replace(/en vivo/gi, '').trim();
  }

  function mostrarEventos(eventos) {
    const agendaDiv = document.getElementById("agenda");
    agendaDiv.innerHTML = "";

    if (eventos.length === 1) {
      agendaDiv.classList.add("unico-evento");
    } else {
      agendaDiv.classList.remove("unico-evento");
    }

    if (eventos.length === 0) {
      document.getElementById("mensaje").textContent = "No hay eventos para mostrar.";
      return;
    }
    document.getElementById("mensaje").textContent = "";

    eventos.forEach(evento => {
      let botonHTML = "";

      if (evento.linkFinal) {
        botonHTML = `<a class="btn-ver" href="${evento.linkFinal}" target="_blank" rel="noopener">Ver</a>`;
      } else {
        botonHTML = `<div style="color:#bbb;font-size:0.9em;">Evento no iniciado o evento ya finalizado</div>`;
      }

      agendaDiv.innerHTML += `
        <div class="evento">
          ${evento.imagen ? `<img src="${evento.imagen}" alt="${evento.titulo}"/>` : ''}
          <h3>${limpiarTitulo(evento.titulo)}</h3>
          ${botonHTML}
        </div>
      `;
    });
  }

  async function cargarAgenda() {
    const mensajeDiv = document.getElementById("mensaje");
    mensajeDiv.textContent = "Cargando eventos...";
    const proxy = "https://api.allorigins.win/raw?url=";
    const feedUrl = proxy + encodeURIComponent("https://jeinzmacias.com/feeds/posts/default?alt=rss");

    try {
      const res = await fetch(feedUrl);
      const xml = await res.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xml, "application/xml");
      const items = Array.from(xmlDoc.getElementsByTagName("item"));

      const fechaHoy = new Date().toISOString().split("T")[0];

      let eventos = items.map(item => {
        const tituloRaw = item.getElementsByTagName("title")[0]?.textContent || "";
        const titulo = limpiarTitulo(tituloRaw);
        const link = item.getElementsByTagName("link")[0]?.textContent || "";
        const pubDate = item.getElementsByTagName("pubDate")[0]?.textContent || "";
        const fechaEvento = new Date(pubDate);
        const fechaStr = fechaEvento.toISOString().split("T")[0];

        let imagen = null;
        const mediaContent = item.getElementsByTagName("media:content")[0];
        if (mediaContent && mediaContent.getAttribute("url")) {
          imagen = mediaContent.getAttribute("url");
        } else {
          const descripcionImg = item.getElementsByTagName("description")[0]?.textContent || "";
          const imgMatch = descripcionImg.match(/<img[^>]+src="([^">]+)"/i);
          if (imgMatch) {
            imagen = imgMatch[1];
          }
        }

        // Buscar primer iframe en la descripción
        const descripcion = item.getElementsByTagName("description")[0]?.textContent || "";
        const iframeMatch = descripcion.match(/<iframe[^>]+src="([^">]+)"/i);
        let linkFinal = null;

        if (iframeMatch) {
          const src = iframeMatch[1];
          const chMatch = src.match(/ch(\d+)\.php/i);
          if (chMatch) {
            const numero = parseInt(chMatch[1], 10); // quitar ceros iniciales
            linkFinal = `https://ecplaytv.foroactivo.com/h4-yt.html?get=https://elverruca.tech/${numero}.php`;
          }
        }

        return { titulo, tituloRaw, link, linkFinal, fechaEvento, fechaStr, imagen };
      });

      eventos = eventos.filter(ev => ev.fechaStr === fechaHoy);

      eventos.sort((a, b) => b.fechaEvento - a.fechaEvento);
      eventos.reverse();

      eventosGlobal = eventos;
      mostrarEventos(eventos);
    } catch (error) {
      console.error(error);
      mensajeDiv.textContent = "Error cargando la agenda.";
    }
  }

  document.getElementById("inputBuscar").addEventListener("input", e => {
    const filtro = e.target.value.toLowerCase();
    const eventosFiltrados = eventosGlobal.filter(ev => ev.titulo.toLowerCase().includes(filtro));
    mostrarEventos(eventosFiltrados);
  });

  cargarAgenda();
  setInterval(cargarAgenda, 3 * 60 * 1000);
</script>


</body>
</html>
