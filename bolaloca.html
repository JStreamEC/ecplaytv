<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Player</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100vh;
        background: black;
        overflow: hidden;
    }

    iframe {
        position: fixed;   /* Hace que cubra toda la pantalla */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
</head>
<body>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
        const iframe = document.createElement("iframe");
        iframe.src = `https://embedme.click/player/1/${id}`;
        iframe.allow = "autoplay; fullscreen";
        iframe.allowFullscreen = true;
        document.body.appendChild(iframe);
    }
</script>

</body>
</html>
