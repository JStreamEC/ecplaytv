        const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    function renderCanales(searchTerm = '') {
        const canalContainer = document.getElementById('canal-container');
        canalContainer.innerHTML = canalesData
            .filter(canal => canal.nombre.toLowerCase().includes(searchTerm.toLowerCase()))
            .map((canal, canalIndex) => `
                <div class="channel-card" data-channel-id="${canalIndex}">
                    <img src="${canal.logo}" alt="${canal.nombre}">
                    <div class="channel-info">
                        <h2>${canal.nombre}</h2>
                        <p class="favorite-status ${favorites.some(fav => fav.id === canalIndex) ? 'favorito' : ''}" onclick="toggleFavorite(this, ${canalIndex})">
                            ${favorites.some(fav => fav.id === canalIndex) ? '★' : '☆'}
                        </p>
                    </div>
                    <button class="view-signals" onclick="openModal(${canalIndex})">Ver señales</button>
                </div>
            `).join('');
    }
        function openTab(evt, tabName) {
            const tabContents = document.getElementsByClassName('tab-content');
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].style.display = 'none';
            }
            const tabButtons = document.getElementsByClassName('tab-button');
            for (let i = 0; i < tabButtons.length; i++) {
                tabButtons[i].className = tabButtons[i].className.replace(' active', '');
            }
            document.getElementById(tabName).style.display = 'block';
            evt.currentTarget.className += ' active';
        }
        function openModal(canalIndex) {
            const canal = canalesData[canalIndex];
            const modalContent = document.querySelector('.modal-content');
            modalContent.innerHTML = `
                <h4>Selecciona una señal</h4>
                ${canal.señales.map((signal, index) => `
                    <button onclick="playSignal(${canalIndex}, ${index})">${signal.nombre}</button>
                `).join('')}
                <br><br>
                <button class="close" onclick="closeModal()">Cerrar</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
		function playSignal(canalIndex, signalIndex) {
			const signal = canalesData[canalIndex].señales[signalIndex];
			if (signal) {
				if (signal.nombre === "Web") {
					window.open(signal.url, '_blank');
				} else if (["Señal 1", "Señal 2", "Señal 3", "Señal 4", "Señal 5"].includes(signal.nombre)) {
					const header = JSON.parse(signal.params || '{}');
					PlayerApp.onPlay(signal.url, JSON.stringify(header), "{}");
				} else {
					const header = JSON.parse(signal.params || '{}');
					PlayerApp.onPlay(signal.url, "", signal.params);
				}
			}
		}
    function toggleFavorite(element, canalIndex) {
        let isFavorite = favorites.some(fav => fav.id === canalIndex);
        if (isFavorite) {
            favorites.splice(favorites.findIndex(fav => fav.id === canalIndex), 1);
            element.innerHTML = '☆'; // Estrella vacía cuando no está en favoritos
            element.classList.remove('favorito');
        } else {
            favorites.push({ id: canalIndex });
            element.innerHTML = '★'; // Estrella llena cuando está en favoritos
            element.classList.add('favorito');
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        renderFavorites();
        renderCanales(document.getElementById('search').value); // Re-render channels after toggle
    }
function renderFavorites() {
    const favoriteList = document.getElementById('favoriteList');
    favoriteList.innerHTML = favorites.map(fav => {
        const canal = canalesData[fav.id];
        return `
            <div class="channel-card">
                <img src="${canal.logo}" alt="${canal.nombre}">
                <div class="channel-info">
                    <h2>${canal.nombre}</h2>
                    <p class="favorite-status favorito">★</p> <!-- Estrella llena cuando está en favoritos -->
                </div>
                <button class="view-signals" onclick="openModal(${fav.id})">Ver señales</button>
            </div>
        `;
    }).join('');
}
        // Event listener for search input
        document.getElementById('search').addEventListener('input', function() {
            renderCanales(this.value);
        });
        // Render the channels and favorites on page load
        renderCanales();
        renderFavorites();
    </script>
