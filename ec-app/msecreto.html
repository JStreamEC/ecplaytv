    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-color: black;
        }

        .container5 {
            text-align: center;
            padding: 1px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            margin-top: 15px;
            color: #ffffff;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: #fa981b;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 200px;
            text-align: center;
            transition: transform 0.3s ease;
            cursor: pointer;
            margin: 10px;
          	border: 0px solid rgb(0 0 0);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
          	background: black;
        }

        .card p {
            font-size: 1.2rem;
            color: #ffffff;
            padding: 10px 0;
            margin-bottom: 0px;
            position: relative;
        }

        /* Animación aplicada solo a los elementos <p> */
        .card p::before, .card p::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background-color: white;
            transition: 0.4s;
        }

        .card p::before {
            top: 0;
            left: 0;
        }

        .card p::after {
            bottom: 0;
            right: 0;
        }

        .card:hover p::before {
            width: 100%;
            left: 0;
        }

        .card:hover p::after {
            width: 100%;
            right: 0;
        }

        /* Quitar efectos de hover, focus y el color de los enlaces */
        a {
            text-decoration: none;
            color: inherit;
        }

        a:hover, a:focus, a:visited, a:link, a:active {
            text-decoration: none;
            color: inherit;
        }

        /* Evitar cambios de diseño al hacer clic */
        .card:active {
            transform: none;
        }

        /* Media Queries para Responsividad - Doble columna en móviles */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            /* Doble columna para móviles */
            .card-container {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                padding: 0 10px;
            }
            
            .card {
                width: 100%;
                margin: 0;
             }
            
            .card img {
                width: 100%;
                height: 100px;
                object-fit: contain;
                padding: 10px;
                background: black;
            }
            
            .card p {
                padding: 8px 5px;
                font-size: 1rem;
                text-align: center;
                min-height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            /* Ocultar animaciones en móvil para mejor rendimiento */
            .card p::before, .card p::after {
                display: none;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
            
            .card-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 0 8px;
            }
            
            .card img {
                height: 90px;
                padding: 8px;
            }
            
            .card p {
                font-size: 0.9rem;
                padding: 6px 4px;
                min-height: 36px;
            }
        }

        @media (max-width: 360px) {
            /* Para pantallas muy pequeñas, mantener dos columnas pero ajustar tamaños */
            .card img {
                height: 80px;
            }
            
            .card p {
                font-size: 0.85rem;
                min-height: 32px;
            }
        }

        /* Estilos para el modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: #ffffff;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #00ff7f;
        }
        
        .modal-content button {
            width: 80%;
            margin: 10px 0;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #00ff7f;
            color: #000000;
        }
        
        .modal-content button:hover {
            background-color: #00cc66;
        }
        
        .modal-content button.cancel {
            background-color: #ff6347;
            margin-top: 20px;
            width: 50%;
        }
        
        .modal-content button.cancel:hover {
            background-color: #e5533d;
        }
        
        .ad-wrapper {
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            height: 100px;
        }
    </style>
</head>

            document.getElementById(modalId).style.display = "none";

        window.onclick = function(event) {

<style>
#pointer {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.1s linear;
}

#pointer svg {
  width: 32px;
  height: 32px;
  fill: white; /* color principal del cursor */
  stroke: black; /* borde para que se vea bien en cualquier fondo */
  stroke-width: 1;
}
</style>

<div id="pointer">
  <!-- SVG estilo cursor clásico -->
  <svg viewBox="0 0 24 24">
    <path d="M2 2 L6 20 L10 14 L14 22 L16 21 L12 13 L18 13 Z"/>
  </svg>
</div>

<script>
  const pointer = document.getElementById("pointer");
  let x = window.innerWidth / 2;
  let y = window.innerHeight / 2;
  const step = 5;
  let active = false;
  let hideTimeout;

  function movePointer() {
    pointer.style.left = x + "px";
    pointer.style.top = y + "px";
  }

  function showPointer() {
    pointer.style.opacity = 1;
    active = true;
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      pointer.style.opacity = 0;
      active = false;
    }, 3000);
  }

  document.addEventListener("keydown", (e) => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].includes(e.key)) {
      showPointer();
      switch (e.key) {
        case "ArrowUp": y = Math.max(0, y - step); break;
        case "ArrowDown": y = Math.min(window.innerHeight, y + step); break;
        case "ArrowLeft": x = Math.max(0, x - step); break;
        case "ArrowRight": x = Math.min(window.innerWidth, x + step); break;
        case "Enter":
          const el = document.elementFromPoint(x, y);
          if(el) el.click();
          break;
      }
      movePointer();
    }
  });

  ["mousemove", "mousedown", "touchstart"].forEach(evt => {
    document.addEventListener(evt, () => {
      pointer.style.opacity = 0;
      active = false;
      clearTimeout(hideTimeout);
    });
  });

  window.addEventListener("resize", () => {
    x = Math.min(x, window.innerWidth);
    y = Math.min(y, window.innerHeight);
    if(active) movePointer();
  });

  movePointer();
</script>
