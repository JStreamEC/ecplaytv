<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>Menu Selectivo</title>
<style>
/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #000;
    color: #fff;
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    -ms-flex-pack: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ===== CONTENEDOR ===== */
.container5 {
    text-align: center;
    padding: 1px;
    width: 100%;
    max-width: 1200px;
}

h1 {
    font-size: 2.5rem;
    margin: 15px 0 30px;
    color: #ffffff;
    font-weight: bold;
}

/* ===== TARJETAS ===== */
.card-container {
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-flex-wrap: wrap;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    -ms-flex-pack: center;
    justify-content: center;
    padding: 0 8px;
}

.card {
    background-color: #fa981b;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 200px;
    text-align: center;
    -webkit-transition: -webkit-transform 0.3s ease;
    transition: transform 0.3s ease;
    cursor: pointer;
    margin: 10px;
    border: 0 solid #000;
    overflow: hidden;
    /* Fallback para WebView antiguos */
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background: #000;
    display: block;
}

.card p {
    font-size: 1.2rem;
    color: #ffffff;
    padding: 10px 0;
    margin-bottom: 0;
    position: relative;
    overflow: hidden;
}

/* Animación con transform (más compatible y eficiente) */
.card p::before,
.card p::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 2px;
    background-color: #fff;
    -webkit-transform: scaleX(0);
    transform: scaleX(0);
    -webkit-transition: -webkit-transform 0.4s ease;
    transition: transform 0.4s ease;
}

.card p::before {
    top: 0;
    left: 0;
    -webkit-transform-origin: left center;
    transform-origin: left center;
}

.card p::after {
    bottom: 0;
    right: 0;
    -webkit-transform-origin: right center;
    transform-origin: right center;
}

.card:hover p::before,
.card:focus p::before {
    -webkit-transform: scaleX(1);
    transform: scaleX(1);
}

.card:hover p::after,
.card:focus p::after {
    -webkit-transform: scaleX(1);
    transform: scaleX(1);
}

/* ===== ENLACES ===== */
a {
    text-decoration: none;
    color: inherit;
    display: block;
}

a:hover, a:focus, a:visited, a:link, a:active {
    text-decoration: none;
    color: inherit;
    outline: none;
}

/* ===== MODALES ===== */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    /* Centrado compatible con WebView antiguos */
    text-align: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.modal::before {
    content: '';
    display: inline-block;
    height: 100%;
    vertical-align: middle;
    width: 0;
}

.modal-content {
    display: inline-block;
    vertical-align: middle;
    background-color: #1e1e1e;
    border-radius: 12px;
    padding: 30px 20px;
    width: 80%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    color: #ffffff;
    margin: 20px auto;
    text-align: center;
}

.modal-content h2 {
    margin-bottom: 20px;
    font-size: 24px;
    color: #00ff7f;
}

.modal-content button {
    display: block;
    width: 80%;
    margin: 10px auto;
    padding: 12px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #00ff7f;
    color: #000000;
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
}

.modal-content button:hover,
.modal-content button:focus {
    background-color: #00cc66;
    outline: none;
}

.modal-content button.cancel {
    background-color: #ff6347;
    margin-top: 20px;
    width: 50%;
}

.modal-content button.cancel:hover,
.modal-content button.cancel:focus {
    background-color: #e5533d;
}

/* ===== CURSOR VIRTUAL ===== */
#pointer {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    -webkit-transition: opacity 0.3s ease;
    transition: opacity 0.3s ease;
    left: 0;
    top: 0;
    will-change: transform;
}

#pointer svg {
    width: 32px;
    height: 32px;
    fill: white;
    stroke: black;
    stroke-width: 1;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    h1 {
        font-size: 2rem;
        margin-bottom: 20px;
    }

    .card-container {
        padding: 0 6px;
    }

    .card {
        width: calc(33.333% - 20px);
        margin: 6px;
        min-width: 100px;
    }

    .card img {
        height: 100px;
    }

    .card p {
        padding: 8px 5px;
        font-size: 1rem;
        min-height: 40px;
        display: -webkit-box;
        display: -webkit-flex;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-align: center;
        -webkit-align-items: center;
        -ms-flex-align: center;
        align-items: center;
        -webkit-box-pack: center;
        -webkit-justify-content: center;
        -ms-flex-pack: center;
        justify-content: center;
    }

    /* Ocultar animaciones en móvil para mejor rendimiento */
    .card p::before,
    .card p::after {
        display: none;
    }

    .modal-content {
        width: 90%;
        padding: 25px 15px;
    }

    .modal-content h2 {
        font-size: 20px;
    }

    .modal-content button {
        font-size: 16px;
        padding: 10px;
    }
}

@media (max-width: 480px) {
    h1 {
        font-size: 1.5rem;
        margin-bottom: 15px;
    }

    .card-container {
        padding: 0 4px;
    }

    .card {
        width: calc(50% - 12px);
        margin: 5px;
    }

    .card img {
        height: 90px;
    }

    .card p {
        font-size: 0.9rem;
        padding: 6px 4px;
        min-height: 36px;
    }
}

@media (max-width: 360px) {
    .card {
        width: calc(50% - 10px);
        margin: 4px;
    }

    .card img {
        height: 80px;
    }

    .card p {
        font-size: 0.85rem;
        min-height: 32px;
    }

    .modal-content {
        width: 95%;
        padding: 20px 10px;
    }
}

/* WebView muy antiguos: fallback sin flex en card-container */
@supports not (display: flex) {
    .card-container {
        display: block;
        text-align: center;
    }
    .card {
        display: inline-block;
        vertical-align: top;
    }
}
</style>

<script>
(function() {
    'use strict';

    // ===== AGENDA + PESTAÑA EXTRA =====
    window.abrirAgendaYExtra = function(event) {
        var enlacesExtra = [
            "https://asiafilm.org/4/98ea3050047b5910e8f5acaeb64058ec?target=external",
            "https://omg10.com/4/11787958&target=external",
            "https://auctionr.org/4/08965ecfc4ee3d490fadd61c55553a35?target=external",
            "https://app-finanzas-mu.vercel.app/?target=external"
        ];

        var urlAgenda = "https://calendario-futbol.blogspot.com/p/ag2425.html";
        var urlExtra = enlacesExtra[Math.floor(Math.random() * enlacesExtra.length)];

        // Abrir extra en pestaña nueva
        try {
            var a = document.createElement("a");
            a.href = urlExtra;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch (e) {
            window.open(urlExtra, "_blank");
        }

        // Navegar a Agenda en la pestaña actual
        window.location.href = urlAgenda;

        if (event) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
        }
        return false;
    };

    // ===== MODALES =====
    window.openModal = function(modalId) {
        var m = document.getElementById(modalId);
        if (m) m.style.display = "block";
    };

    window.closeModal = function(modalId) {
        var m = document.getElementById(modalId);
        if (m) m.style.display = "none";
    };

    // Cerrar al hacer clic fuera
    window.addEventListener("click", function(event) {
        var modal1 = document.getElementById("myModal");
        var modal2 = document.getElementById("myModal2");
        var modal3 = document.getElementById("myModal3");
        if (event.target === modal1) closeModal("myModal");
        if (event.target === modal2) closeModal("myModal2");
        if (event.target === modal3) closeModal("myModal3");
    });

    // Cerrar con ESC
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" || e.keyCode === 27) {
            closeModal("myModal");
            closeModal("myModal2");
            closeModal("myModal3");
        }
    });

    // Asignar eventos a los botones que abren modales
    function bindModal(btnId, modalId) {
        var btn = document.getElementById(btnId);
        if (btn) {
            btn.onclick = function(e) {
                if (e.preventDefault) e.preventDefault();
                openModal(modalId);
                return false;
            };
        }
    }
    bindModal("openModal1", "myModal");
    bindModal("openModal2", "myModal2");
    bindModal("openModal3", "myModal3");

    // ===== CURSOR VIRTUAL (TV / TECLADO) =====
    var pointer = document.getElementById("pointer");
    if (pointer) {
        var x = window.innerWidth / 2;
        var y = window.innerHeight / 2;
        var step = 5;
        var active = false;
        var hideTimeout;

        function movePointer() {
            // Usar transform en vez de left/top (más compatible y rápido)
            pointer.style.webkitTransform = "translate(" + x + "px," + y + "px)";
            pointer.style.transform = "translate(" + x + "px," + y + "px)";
        }

        function showPointer() {
            pointer.style.opacity = 1;
            active = true;
            if (hideTimeout) clearTimeout(hideTimeout);
            hideTimeout = setTimeout(function() {
                pointer.style.opacity = 0;
                active = false;
            }, 3000);
        }

        function hidePointer() {
            pointer.style.opacity = 0;
            active = false;
            if (hideTimeout) clearTimeout(hideTimeout);
        }

        document.addEventListener("keydown", function(e) {
            var key = e.key;
            var code = e.keyCode;
            var isArrow = (key === "ArrowUp" || key === "ArrowDown" || key === "ArrowLeft" || key === "ArrowRight" ||
                          code === 37 || code === 38 || code === 39 || code === 40);
            var isEnter = (key === "Enter" || code === 13);
            var isSpace = (key === " " || code === 32);

            if (isArrow || isEnter || isSpace) {
                showPointer();
                if (key === "ArrowUp" || code === 38)    y = Math.max(0, y - step);
                if (key === "ArrowDown" || code === 40)  y = Math.min(window.innerHeight, y + step);
                if (key === "ArrowLeft" || code === 37)  x = Math.max(0, x - step);
                if (key === "ArrowRight" || code === 39) x = Math.min(window.innerWidth, x + step);

                if (isEnter || isSpace) {
                    var el = document.elementFromPoint(x, y);
                    if (el) {
                        // Subir al enlace padre si es necesario
                        var target = el;
                        while (target && target.tagName !== "A" && target !== document.body) {
                            target = target.parentNode;
                        }
                        if (target && target.tagName === "A") {
                            target.click();
                        } else if (el.click) {
                            el.click();
                        }
                    }
                    if (e.preventDefault) e.preventDefault();
                }
                movePointer();
            }
        });

        ["mousemove", "mousedown", "touchstart", "touchmove"].forEach(function(evt) {
            document.addEventListener(evt, hidePointer, { passive: true });
        });

        window.addEventListener("resize", function() {
            x = Math.min(x, window.innerWidth);
            y = Math.min(y, window.innerHeight);
            if (active) movePointer();
        });

        // Inicializar
        pointer.style.left = "0";
        pointer.style.top = "0";
        movePointer();
    }
})();
</script>
