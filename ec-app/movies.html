    }
    .search-bar input {
        width: 100%;

        border-radius: 5px;
        border: none;
        outline: none;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);

    .media-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
        margin: auto;
    }
    .media-card {
        background-color: #2b2b3d;
        border-radius: 10px;
        overflow: hidden;
        width: 250px;
        position: relative;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }
    .media-card:hover {
        transform: scale(1.05);
        box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.4);
    }
    .media-card img {
        width: 100%;
        height: 375px;
        object-fit: cover;
    }
    .media-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 15px;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .media-card:hover .media-info {
        opacity: 1;
    }
    .media-info h3 {
        margin: 0;
        font-size: 18px;
    }
    .media-info p {
        font-size: 14px;
        margin: 5px 0;
    }
    .media-info button {
        padding: 10px 15px;
        background-color: #ff4d4d;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        transition: background-color 0.3s ease;
    }
    .media-info button:hover {
        background-color: #ff6666;
    }
    /* Adaptaciones para móviles */
    @media (max-width: 768px) {
        .media-grid {
            justify-content: space-between;
        }
        .media-card {
            width: 45%; /* Dos columnas en pantallas móviles */
            height: auto;
        }
        .media-card img {
            height: auto;
        }
        .search-bar {
            margin: 20px;
            max-width: 90%; /* Ajustar el tamaño para dispositivos móviles */
        }
    }
    /* Estilos para pantallas extra pequeñas */
    @media (max-width: 480px) {
        .media-card {
            width: 45%; /* Una columna completa en pantallas pequeñas */
        }
    }
</style>

<!-- Script para la lógica JavaScript -->
<script>
    const apiKey = '9eecc30ae89f253bce3cec4140734493';  // Tu API Key de TMDb
    const baseImageUrl = 'https://image.tmdb.org/t/p/w500';
    let allMedia = []; // Aseguramos que allMedia esté definida globalmente
</script>
<script>
    // ===========================
    // Función para convertir minutos a horas y minutos
    // ===========================
    function formatRuntime(minutes) {
        if (!minutes) return 'N/A'; // Si no hay datos, devolver "N/A"
        const hours = Math.floor(minutes / 60);
        const remainingMinutes = minutes % 60;
        return `${hours}h ${remainingMinutes}m`;
    }
</script>
<script>
// ===========================
// Función para generar las tarjetas de películas y series de televisión
// ===========================
function generateMediaCards(media) {
    const mediaGrid = document.getElementById('media-grid');
    mediaGrid.innerHTML = ''; // Limpiar el contenido actual antes de agregar nuevas tarjetas
    media.forEach(item => {
        // Determinar el endpoint correcto basado en el tipo de contenido
        const mediaType = item.type === 'tv' ? 'tv' : 'movie';
        fetch(`https://api.themoviedb.org/3/${mediaType}/${item.id}?api_key=${apiKey}&language=es-ES`)
            .then(response => response.json())
            .then(data => {
                const genres = data.genres.map(genre => genre.name).join(", ");
                const mediaCard = document.createElement('div');
                mediaCard.classList.add('media-card');
                // Generar la URL estática para el botón de "Reproducir"
                const trailerUrl = `https://acectv.blogspot.com/p/jsmovie.html?id=${item.id}`;
                // Determinar campos dinámicos basados en si es película o serie
                const title = mediaType === 'tv' ? data.name : data.title;
                const releaseDate = mediaType === 'tv' ? data.first_air_date : data.release_date;
                const runtime = mediaType === 'tv' ? `${data.number_of_seasons} temporadas` : formatRuntime(data.runtime);
                mediaCard.innerHTML = `
                    <img src="${baseImageUrl + data.poster_path}" alt="${title}" />
                    <div class="media-info">
                        <h3>${title}</h3>
                        <p>${releaseDate ? releaseDate.split("-")[0] : "N/A"} | ${genres}</p>
                        <p>${Math.round(data.vote_average)} ⭐ | ${runtime}</p>
                        <!-- Cambié el enlace para que siempre use el ID y lo dirija al enlace fijo -->
                        <button onclick="window.open('${trailerUrl}', '_blank')">Reproducir</button>
                    </div>
                `;
                mediaGrid.appendChild(mediaCard);
            })
            .catch(error => console.error('Error al obtener los datos:', error));
    });
}
</script>
<script>
    // ===========================
    // Función para cargar las películas desde el JSON
    // ===========================
function loadMedia() {
    const mediaData = JSON.parse(document.getElementById('mediaData').textContent);
    allMedia = mediaData.media; // Almacenar las películas y series en allMedia
    generateMediaCards(allMedia); // Generar las tarjetas
}
</script>
<script>
    // ===========================
    // Barra de búsqueda - Función para buscar películas por título
    // ===========================
function searchMedia() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const filteredMedia = allMedia.filter(item => item.title.toLowerCase().includes(query));
    // Si no se encuentra nada, mostrar mensaje de "no encontrado"
    if (filteredMedia.length === 0) {
        alert('No se encontraron resultados.');
    }
    generateMediaCards(filteredMedia);
}
</script>
<script>
    // ===========================
    // Cargar las películas al inicio
    // ===========================
    loadMedia();
</script>
