// Función de debug para verificar zonas horarias
function debugZonasHorarias() {
    console.log('Hora local usuario:', new Date().toString());
    console.log('Hora GMT-5 calculada:', obtenerHoraActualGMT5().toString());
    console.log('Evento ejemplo inicio:', new Date(eventos[0].inicio).toString());
}
// Llama esta función para verificar en la consola
debugZonasHorarias();

	// Función para convertir fecha a zona horaria específica
function convertirZonaHoraria(fecha, offsetMinutos) {
    const date = new Date(fecha);
    const localTime = date.getTime();
    const localOffset = date.getTimezoneOffset() * 60000;
    const utc = localTime + localOffset;
    return new Date(utc + (offsetMinutos * 60000));
}

// Función para obtener hora actual en GMT-5
function obtenerHoraActualGMT5() {
    const ahora = new Date();
    const offsetGMT5 = -5 * 60; // GMT-5 en minutos
    return convertirZonaHoraria(ahora, offsetGMT5);
}

// Función para verificar el estado del evento (CORREGIDA)
function verificarEstadoEvento(evento) {
    // Convertir inicio del evento a fecha JavaScript (ya incluye offset -05:00)
    var inicio = new Date(evento.inicio);
    
    // Obtener hora actual en GMT-5 para comparar correctamente
    var ahora = obtenerHoraActualGMT5();
    
    var duracionMs = evento.duracion * 60 * 1000;
    var fin = new Date(inicio.getTime() + duracionMs);
    var finConMargen = new Date(fin.getTime() + 5 * 60 * 1000);

    var estadoElem = document.getElementById('status-' + evento.id);
    var card = document.getElementById('card-' + evento.id);
    var estadoSpan = estadoElem ? estadoElem.querySelector('span') : null;

    var estado = "Proximamente";
    var clase = "amarillo";

            if (ahora >= inicio && ahora < fin) {
                estado = "En vivo";
                clase = "verde";
                if (estadoElem) {
                    var tiempoTranscurrido = ahora - inicio;
                    var porcentaje = Math.min((tiempoTranscurrido / duracionMs) * 100, 100);
                    estadoElem.style.setProperty('--progress', porcentaje + '%');
                }
                if (estadoSpan) {
                    estadoSpan.classList.add('estado-palpitar');
                }
            } else if (ahora >= fin && ahora < finConMargen) {
                estado = "Finalizado";
                clase = "rojo";
                if (estadoElem) {
                    estadoElem.style.setProperty('--progress', '100%');
                }
                if (estadoSpan) {
                    estadoSpan.classList.remove('estado-palpitar');
                }
            } else if (ahora >= finConMargen) {
                if (card) {
                    card.style.display = 'none';
                }
                if (estadoElem) {
                    estadoElem.style.setProperty('--progress', '100%');
                }
                if (estadoSpan) {
                    estadoSpan.classList.remove('estado-palpitar');
                }
                return;
            } else {
                if (estadoElem) {
                    estadoElem.style.setProperty('--progress', '0%');
                }
                if (estadoSpan) {
                    estadoSpan.classList.remove('estado-palpitar');
                }
            }

            if (estadoElem && estadoSpan) {
                estadoSpan.textContent = estado;
                estadoElem.className = 'status-live ' + clase + ' progress-bar';
            }
        }

    const container = document.querySelector('.cards-container');
    container.innerHTML = ''; // Limpiamos contenido inicial

// Variable para controlar el event listener
let modalClickListener = null;

function mostrarSenales(id) {
  const evento = eventos.find(e => e.id === id);
  if (!evento) return;

  document.getElementById("modal-evento-titulo-simple").innerText = evento.evento;

  const contenedor = document.getElementById("contenedor-senales-simple");
  contenedor.innerHTML = evento.senales.length > 0 
    ? evento.senales.map(senal => `
        <a href="${senal.url}" target="_blank" class="senal-btn-simple">${senal.nombre}</a>
      `).join('')
    : '<p style="color: #ccc; text-align: center;">No hay transmisiones disponibles</p>';

  const modal = document.getElementById("modal-simple");
  modal.classList.add("activo");
  
  // Remover listener anterior si existe
  if (modalClickListener) {
    modal.removeEventListener('click', modalClickListener);
  }
  
  // Crear nuevo listener
  modalClickListener = function(event) {
    if (event.target === modal) {
      cerrarModalSimple();
    }
  };
  
  modal.addEventListener('click', modalClickListener);
}

function cerrarModalSimple() {
  const modal = document.getElementById("modal-simple");
  modal.classList.remove("activo");
  
  // Opcional: remover el event listener al cerrar
  if (modalClickListener) {
    modal.removeEventListener('click', modalClickListener);
    modalClickListener = null;
  }
}

// Función para aplicar y guardar el tema
function applyTheme(theme) {
  const appElement = document.getElementById('mi-app');
  if (!appElement) return;
  
  // Limpiar clases de tema anteriores
  appElement.classList.remove('tema-oscuro', 'tema-claro');
  
  // Aplicar nuevo tema
  appElement.classList.add(`tema-${theme}`);
  
  // Guardar preferencia
  localStorage.setItem('tema', theme);
  
  // Actualizar iconos (opcional)
  updateThemeIcons(theme);
}

// Función para actualizar los iconos del botón
function updateThemeIcons(theme) {
  const sunIcon = document.querySelector('.sun-icon');
  const moonIcon = document.querySelector('.moon-icon');
  
  if (theme === 'oscuro') {
    sunIcon.style.display = 'block';
    moonIcon.style.display = 'none';
  } else {
    sunIcon.style.display = 'none';
    moonIcon.style.display = 'block';
  }
}

// Al cargar la página
document.addEventListener('DOMContentLoaded', function() {
  // Obtener tema guardado o usar oscuro por defecto
  const savedTheme = localStorage.getItem('tema') || 'oscuro';
  applyTheme(savedTheme);
  
  // Configurar el botón de cambio de tema
  const themeToggle = document.querySelector('.theme-toggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', function() {
      const currentIsOscuro = document.getElementById('mi-app').classList.contains('tema-oscuro');
      applyTheme(currentIsOscuro ? 'claro' : 'oscuro');
    });
  }
});

function formatearFechaConZona(fechaISO) {
    const fecha = new Date(fechaISO);

    const opciones = {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        hour: '2-digit',
        minute: '2-digit'
    };

    let fechaFormateada = fecha.toLocaleString('es-ES', opciones);

    // Resultado viene algo como: "lunes, 15 de septiembre 11:30"
    // Ajustamos para que sea: "Lunes, 15 de septiembre a las 11:30"
    fechaFormateada = fechaFormateada
        .replace(/(\d{1,2}:\d{2})$/, 'a las $1') // inserta "a las" antes de la hora
        .replace(/^\w/, c => c.toUpperCase());   // capitaliza el día

    return fechaFormateada;
}

    // Función principal para actualizar datos
    async function actualizarDatosEventos() {
      for (const evento of eventos) {
        // Verificar estado del evento
        verificarEstadoEvento(evento);
        
        // Si la tarjeta está oculta, no actualizar sus datos
        const card = document.getElementById(`card-${evento.id}`);
        if (card && card.style.display === 'none') continue;
        
        const esIdNumerico = /^\d+$/.test(evento.id);
        const statsRow = document.getElementById(`stats-${evento.id}`);
        const estadoElem = document.getElementById(`status-${evento.id}`);
        const estadoSpan = estadoElem?.querySelector('span');
        const esEnVivo = estadoSpan?.textContent?.includes("En vivo");

        // Mostrar/ocultar stats row basado en el tipo de evento y estado
        if (statsRow) {
          if (esEnVivo) {
            statsRow.classList.add('visible');
          } else {
            statsRow.classList.remove('visible');
          }
        }

        // Solo actualizar datos para eventos con ID numérico
        if (esIdNumerico) {
          const liga = obtenerLigaPorId(evento.id);
          const datos = await obtenerDatosPartido(evento.id, liga);

          if (!datos || !datos.status) continue;

          const status = datos.status;
          const score = datos.scoreStatus || {};
          const homeId = datos.match?.homeTeamId;
          const awayId = datos.match?.awayTeamId;

          const summary = datos.summary || {};
          const cornerKicks = summary.cornerKicks || {};
          const yellowCards = summary.yellowCards || {};
          const redCards = summary.redCards || {};

          // Actualizar marcador
          const marcadorElem = document.getElementById(`score-${evento.id}`);
          if (marcadorElem) {
            marcadorElem.innerText = esEnVivo 
              ? `${score?.[homeId]?.score ?? 0} : ${score?.[awayId]?.score ?? 0}` 
              : "VS";
          }

          // Actualizar tiempo del partido si está en vivo
          if (esEnVivo && estadoSpan) {
            let tiempoTexto = "";
            
            if (status.value === "Entretiempo") {
              tiempoTexto = "ET";
            } else if (status.value === "Finalizado") {
              tiempoTexto = "FIN";
            } else if (status.shootout) {
              tiempoTexto = "Penales";
            } else if (status.extraTime) {
              tiempoTexto = `T.E. ${status.currentMinutes}'`;
            } else {
              // Tiempo normal
              tiempoTexto = `${status.currentPeriod}T - ${status.currentMinutes}'`;
            }
            
            estadoSpan.textContent = `En vivo: ${tiempoTexto}`;
          }

          // Actualizar estadísticas solo si está en vivo
          if (esEnVivo) {
            // Corners
            const cornerElem = document.getElementById(`corners-${evento.id}`);
            if (cornerElem) {
              cornerElem.innerText = `${cornerKicks.homeQty ?? 0} - ${cornerKicks.awayQty ?? 0}`;
            }

            // Amarillas
            const amarillasElem = document.getElementById(`yellow-${evento.id}`);
            if (amarillasElem) {
              amarillasElem.innerText = `${yellowCards.homeQty ?? 0} - ${yellowCards.awayQty ?? 0}`;
            }

            // Rojas
            const rojasElem = document.getElementById(`red-${evento.id}`);
            if (rojasElem) {
              rojasElem.innerText = `${redCards.homeQty ?? 0} - ${redCards.awayQty ?? 0}`;
            }
          }
        }
      }
    }

    // Función para obtener datos reales
    async function obtenerDatosPartido(idPartido, liga) {
      try {
        const url = `https://sportsdf.datafactory.la/html/v3/htmlCenter/data/deportes/futbol/${liga}/events/${idPartido}.json`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error(`Error en partido ${idPartido}:`, error);
        return null;
      }
    }

    // Obtener liga por id
    function obtenerLigaPorId(idPartido) {
      const partido = eventos.find(e => e.id === idPartido);
      if (!partido) return 'sudamericana';

      const liga = partido.liga.toLowerCase();
      if (liga.includes("fifa intercontinental cup")) return "mundialclubes";
      if (liga.includes("mundial sub-20")) return "mundialsub20";
      if (liga.includes("amistosos")) return "amistoso";
      if (liga.includes("uefa europa conference league")) return "conferenceleague";
      if (liga.includes("uefa europa league")) return "uefa";
      if (liga.includes("uefa champions league")) return "champions";
      if (liga.includes("friendlies")) return "amistoso";
      if (liga.includes("world cup - qualification south america")) return "eliminatorias";
      if (liga.includes("world cup - qualification europe")) return "europa";
      if (liga.includes("clasificación mundial - europa")) return "europa";
      if (liga.includes("serie a it")) return "italia";
      if (liga.includes("bundesliga")) return "alemania";
      if (liga.includes("super cup")) return "supercopaalemania";
      if (liga.includes("premier league")) return "premierleague";
      if (liga.includes("ligue 1")) return "francia";
      if (liga.includes("uefa super cup")) return "uefasupercopa";
      if (liga.includes("community shield")) return "facshield";
      if (liga.includes("leagues cup")) return "leaguescup";
      if (liga.includes("copa argentina")) return "copaargentina";
      if (liga.includes("liga profesional argentina")) return "primeraa";
      if (liga.includes("serie a")) return "brasileirao";
      if (liga.includes("gold cup")) return "copaoro";
      if (liga.includes("club world cup")) return "fifaclubes";
      if (liga.includes("liga pro")) return "ecuador";
      if (liga.includes("primera divisi")) return "peru";
      if (liga.includes("eliminatorias sudamericana")) return "eliminatorias";
      if (liga.includes("la liga")) return "espana";
      if (liga.includes("coppa italia")) return "copaitalia";
      if (liga.includes("sudamericana")) return "sudamericana";
      if (liga.includes("libertadores")) return "libertadores";
      if (liga.includes("liga mx")) return "mexico";
      if (liga.includes("major league soccer")) return "mls";
      if (liga.includes("copa mundial")) return "europa";
      if (liga.includes("eliminatorias concacaf")) return "concacaf";
      if (liga.includes("amistoso fifa")) return "amistoso";
      return "sudamericana";
    }

    // Carga inicial
    actualizarDatosEventos();

    // Actualiza cada 60 segundos
    setInterval(actualizarDatosEventos, 60000);
  </script>
