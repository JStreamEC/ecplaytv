<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Player</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
    }
    iframe {
        display: none;
    }
</style>
</head>
<body>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
        const iframe = document.createElement("iframe");
        iframe.src = `https://tiogolhd.com/vivo/canal.php?stream=${id}`;
        iframe.allow = "autoplay";
        document.body.appendChild(iframe);
    }
</script>

</body>
</html>
